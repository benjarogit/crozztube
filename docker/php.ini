[PHP]
memory_limit = 1024M
upload_max_filesize = 2048M
post_max_size = 2048M
max_execution_time = 3600
max_input_time = 3600
max_file_uploads = 50
allow_url_fopen = On
date.timezone = Europe/Berlin
display_errors = Off
log_errors = On
error_log = /var/log/php-errors.log

[opcache]
opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
opcache.revalidate_freq=2
