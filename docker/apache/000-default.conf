<VirtualHost *:80>
    ServerName localhost
    ServerAlias crozztube.local 127.0.0.1
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    LimitRequestBody 2147483648

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Docker-Bau-/Config-Ordner sind nicht oeffentlich
    <Directory ${APACHE_DOCUMENT_ROOT}/docker>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    ServerAlias crozztube.local 127.0.0.1
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/crozztube-local.pem
    SSLCertificateKeyFile /etc/ssl/private/crozztube-local.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    LimitRequestBody 2147483648

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory ${APACHE_DOCUMENT_ROOT}/docker>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
