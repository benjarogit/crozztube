  /uploads/capabilities:
    get:
      tags: [Uploads]
      operationId: getUploadCapabilities
      summary: Get creator upload limits and supported formats
      description: Requires the mobile `uploads:write` token ability. Current transport is server-proxied chunk upload; direct-to-cloud is reported false.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/UploadCapabilities' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /uploads/sessions:
    post:
      tags: [Uploads]
      operationId: createUploadSession
      summary: Create a chunked upload session
      description: "`total_chunks` must equal `ceil(file_size / chunk_size)`. Supported extensions are MP4, MOV, M4V, WebM, and MKV."
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/UploadSessionCreate' }
      responses:
        '201': { $ref: '#/components/responses/UploadSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }

  /uploads/sessions/{uploadSession}:
    parameters:
      - $ref: '#/components/parameters/UploadSessionId'
    get:
      tags: [Uploads]
      operationId: getUploadSession
      summary: Get an owned upload session
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/UploadSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Uploads]
      operationId: cancelUploadSession
      summary: Cancel an upload session before assembly or processing
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/UploadSession' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /uploads/sessions/{uploadSession}/chunks:
    parameters:
      - $ref: '#/components/parameters/UploadSessionId'
    post:
      tags: [Uploads]
      operationId: uploadChunk
      summary: Upload or replace one session chunk
      description: Multipart upload. The chunk index is zero-based and the file limit equals the server-configured chunk size, 8 MiB by default.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/UploadChunk' }
      responses:
        '200': { $ref: '#/components/responses/UploadSession' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }

