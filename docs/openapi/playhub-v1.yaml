      requestBody: { $ref: '#/components/requestBodies/LiveStreamWrite' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }

  /live-streams/{liveStream}/join:
    parameters:
      - $ref: "#/components/parameters/LiveStreamSlug"
    post:
      tags:
        - Live
      operationId: joinLiveStream
      summary: Issue viewer or approved guest/cohost LiveKit grant
      description: Available while waiting for source or live. Only server-approved participants with live:publish may publish
        permitted camera/microphone sources. Preview grants always remain hidden subscribers and do not mutate audience or
        acceptance state. Room grants expire after 90 seconds; private no-store response.
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          $ref: "#/components/responses/LiveKitJoin"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - name: preview
          in: query
          schema:
            type: boolean
            default: false
          description: Subscriber-only hidden discovery preview; never grants stage publishing or records an audience viewer.

  /live-streams/{liveStream}/creator-join:
    parameters:
