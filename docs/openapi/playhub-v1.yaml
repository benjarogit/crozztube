  /stickers:
    get:
      tags: [Comments]
      operationId: getStickerDiscoveryConfiguration
      summary: Get publishable KLIPY discovery configuration for comment stickers
      description: |
        Returns no local sticker catalogue. Clients request trending/search directly
        from KLIPY using the runtime publishable app key, then register only the selected
        sticker at /stickers/selection. A non-monetized KLIPY key is required.
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200':
          description: KLIPY client configuration, availability, and an empty catalogue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveStickersEnvelope' }
        default: { $ref: '#/components/responses/Error' }

  /stickers/selection:
    post:
      tags: [Comments]
      operationId: registerStickerSelection
      summary: Validate selected KLIPY media and issue an opaque signed submission token
      description: Does not purchase a sticker or persist a bulk provider catalogue. Submit the returned id unchanged as sticker_id or super_sticker_id.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name, image_url]
              properties:
                slug: { type: string, minLength: 1, maxLength: 240, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$' }
                name: { type: string, minLength: 1, maxLength: 80 }
                image_url: { type: string, format: uri, maxLength: 2048 }
                preview_url: { type: [string, 'null'], format: uri, maxLength: 2048 }
                query: { type: [string, 'null'], maxLength: 200 }
              additionalProperties: false
      responses:
        '200':
          description: Signed selected sticker.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [sticker]
                    properties:
                      sticker: { $ref: '#/components/schemas/StickerCatalogItem' }
                  meta: { $ref: '#/components/schemas/RequestMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }

  /live/stickers:
    get:
      tags:
