        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: q
          in: query
          description: Reserved for compatible clients; discovery/search runs directly on KLIPY.
