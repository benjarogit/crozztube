        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /live-streams:
    get:
      tags:
        - Live
      operationId: listLiveStreams
      summary: List visible live, upcoming, or replay streams
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - all
              - live
              - upcoming
              - replay
        - name: category
          in: query
          schema:
            type: string
            maxLength: 190
        - name: q
          in: query
          schema:
            type: string
            maxLength: 160
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - recent
              - viewers
              - start
        - name: date_range
          in: query
          schema:
            type: string
            enum:
              - any
              - today
              - tomorrow
              - week
