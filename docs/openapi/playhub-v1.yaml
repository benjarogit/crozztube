        avatar_url: { type: [string, 'null'], format: uri-reference }
        cover_url: { type: [string, 'null'], format: uri-reference }
        verified: { type: boolean }
        subscribers_count: { type: integer, minimum: 0 }
        videos_count: { type: integer, minimum: 0 }
        viewer:
          type: object
          required: [subscribed]
          properties:
            subscribed: { type: boolean }
    ViewerVideoState:
      type: object
      properties:
        can_edit:
          type: boolean
          description: Present on video details. True only when the authenticated viewer may edit this video under the existing ownership policy. Creator writes still require server authorization.
        liked: { type: boolean }
        watch_later: { type: boolean }
        subscribed: { type: boolean }
        position_seconds: { type: integer, minimum: 0 }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
    VideoCard:
      type: object
      required: [id, slug, title, thumbnail_url, duration_seconds, content_type, source_type, import_provider, published_at, statistics, channel, viewer]
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        content_type: { type: string, enum: [video, short, replay] }
        source_type: { type: string }
        import_provider: { type: [string, 'null'] }
        thumbnail_url: { type: [string, 'null'], format: uri }
        duration_seconds: { type: [integer, 'null'], minimum: 0 }
        published_at: { type: [string, 'null'], format: date-time }
        statistics:
          type: object
          required: [views, likes, comments]
          properties:
            views: { type: integer, minimum: 0 }
            likes: { type: integer, minimum: 0 }
            comments: { type: integer, minimum: 0 }
        channel:
          oneOf:
            - $ref: '#/components/schemas/ChannelSummary'
            - type: 'null'
        viewer: { $ref: '#/components/schemas/ViewerVideoState' }
    VideoDetail:
      allOf:
        - $ref: "#/components/schemas/VideoCard"
        - type: object
          required:
            - description
          properties:
            description:
              type: string
            tags:
              type: array
              items:
                type: string
            category:
              type:
                - object
                - "null"
              additionalProperties: true
            language:
              type:
                - object
                - "null"
              additionalProperties: true
            publication:
              type: object
              additionalProperties: true
            commerce:
              type: object
              additionalProperties: true
            media:
              type: object
              additionalProperties: true
            links:
              type: object
              additionalProperties:
                type: string
                format: uri
            live_replay:
              oneOf:
                - type: object
                  required:
                    - slug
                    - started_at
                    - ended_at
                    - peak_viewers_count
                  additionalProperties: false
                  properties:
                    slug:
                      type: string
                    started_at:
                      type:
                        - string
                        - "null"
                      format: date-time
                    ended_at:
                      type:
                        - string
                        - "null"
                      format: date-time
                    peak_viewers_count:
                      type: "null"
                      description: No actual peak-audience metric is recorded; never synthesize a value.
                - type: "null"
              description: Authorized optional association for live_replay media only. Null when Live is disabled, the source is
                restricted or the replay association has expired. Normal media performs no Live lookup.
    VideoEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/VideoDetail' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    VideoListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/VideoCard' } }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    Short:
      type: object
      required: [id, slug, caption, poster_url, duration_seconds, creator, playback, engagement, resume_position_seconds, share]
      properties:
        id: { type: integer }
        slug: { type: string }
        caption: { type: string }
        poster_url: { type: [string, 'null'], format: uri }
        duration_seconds: { type: [integer, 'null'], minimum: 0 }
        creator: { oneOf: [{ $ref: '#/components/schemas/ChannelSummary' }, { type: 'null' }] }
        playback:
          type: object
          required: [provider, source_type, provider_id, provider_url, sources, expires_at]
          properties:
            provider: { type: string, enum: [native, youtube, vimeo, dailymotion, twitch] }
            source_type: { type: string, enum: [mp4, hls, dash, webm, embed] }
            provider_id:
              type: [string, 'null']
              description: Stable external provider identifier when applicable. Twitch IDs are namespaced as `channel:`, `video:`, or `clip:`.
            provider_url:
              type: [string, 'null']
              format: uri
              description: Authorized canonical provider URL for an embed session. Preserves provider-required data such as Vimeo unlisted privacy hashes.
            sources: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PlaybackSource' } }
            expires_at: { type: [string, 'null'], format: date-time }
        engagement:
          type: object
          required: [liked, watch_later, subscribed, likes_count, comments_count, views_count]
          properties:
            liked: { type: boolean }
            watch_later: { type: boolean }
            subscribed: { type: boolean }
            likes_count: { type: integer, minimum: 0 }
            comments_count: { type: integer, minimum: 0 }
            views_count: { type: integer, minimum: 0 }
        resume_position_seconds: { type: integer, minimum: 0 }
        share:
          type: object
          required: [url, title]
          properties:
            url: { type: string, format: uri }
            title: { type: string }
    ShortEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Short' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    ShortListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Short' } }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    PlaybackCapabilities:
      type: object
      required: [server, client_reported, negotiated, compatible]
      properties:
        server: { $ref: '#/components/schemas/PlaybackServerCapabilities' }
        client_reported: { type: boolean }
        negotiated:
          type: object
          required: [containers, video_codecs, audio_codecs, subtitle_formats, drm, hdr, max_resolution]
          properties:
            containers: { type: array, items: { type: string, enum: [mp4] } }
            video_codecs: { type: array, items: { type: string, enum: [h264] } }
            audio_codecs: { type: array, items: { type: string, enum: [aac] } }
            subtitle_formats: { type: array, items: { type: string, enum: [mov_text, srt, webvtt] } }
            drm: { type: array, maxItems: 0 }
            hdr: { type: array, maxItems: 0 }
            max_resolution: { type: [string, 'null'], enum: [480p, 720p, 1080p, 1440p, 2160p, null] }
        compatible:
          type: [boolean, 'null']
          description: Null when no playback capabilities were reported. Otherwise true only when a compatible container and video/audio codec were negotiated.
    PlaybackServerCapabilities:
      type: object
      required: [delivery, containers, video_codecs, audio_codecs, subtitle_formats, qualities, drm, hdr]
      properties:
        delivery: { type: array, items: { type: string, enum: [progressive] } }
        containers: { type: array, items: { type: string, enum: [mp4] } }
        video_codecs: { type: array, items: { type: string, enum: [h264] } }
        audio_codecs: { type: array, items: { type: string, enum: [aac] } }
        subtitle_formats: { type: array, items: { type: string, enum: [mov_text, srt, webvtt] } }
        qualities: { type: array, items: { type: string, enum: [original, high, medium, low] } }
        drm: { type: array, maxItems: 0 }
        hdr: { type: array, maxItems: 0 }
    PlaybackSource:
      type: object
      required: [id, delivery, quality, default]
      properties:
        id: { type: string }
        url: { type: [string, 'null'], format: uri }
        delivery: { type: string, enum: [progressive, remote, provider] }
        provider: { type: [string, 'null'], enum: [youtube, vimeo, dailymotion, twitch, null] }
        provider_video_id: { type: [string, 'null'] }
        container: { type: [string, 'null'] }
        mime_type: { type: [string, 'null'] }
        video_codec: { type: [string, 'null'] }
        audio_codec: { type: [string, 'null'] }
        quality: { type: string }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        bitrate: { type: [string, 'null'] }
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Source-specific expiry or conservative refresh deadline when an official provider returns a temporary direct playback URL.
        default: { type: boolean }
    PlaybackSession:
      type: object
      required: [session_id, video_id, content_type, provider, source_type, provider_id, provider_url, issued_at, sources, restrictions]
      properties:
        session_id: { type: string, format: uuid }
        video_id: { type: integer }
        content_type: { type: string, enum: [video, short, replay] }
        provider:
          type: string
          enum: [native, youtube, vimeo, dailymotion, twitch]
          description: Playback adapter required by this session. Authenticated Vimeo `play` links use `native`; Vimeo embed fallback uses `vimeo`.
        source_type:
          type: string
          enum: [mp4, hls, dash, webm, embed]
          description: Normalized format for native playback or `embed` for an official external-provider player.
        provider_id:
          type: [string, 'null']
          description: Stable external provider identifier when applicable. Twitch IDs are namespaced as `channel:`, `video:`, or `clip:`.
        provider_url:
          type: [string, 'null']
          format: uri
          description: Authorized canonical provider URL for an embed session. Preserves provider-required data such as Vimeo unlisted privacy hashes. Returned only by access-controlled playback serialization and never cached by the API.
        issued_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        sources: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PlaybackSource' } }
        poster_url: { type: [string, 'null'], format: uri }
        duration_seconds: { type: [integer, 'null'] }
        resume_position_seconds: { type: integer, minimum: 0 }
        restrictions:
          type: object
          required: [playable, paid, drm_required, download_allowed, casting_allowed]
          properties:
            playable: { type: boolean }
            paid: { type: boolean }
            drm_required: { type: boolean, const: false }
            download_allowed: { type: boolean, const: false }
            casting_allowed: { type: boolean }
        captions: { type: array, items: { $ref: '#/components/schemas/CaptionTrack' } }
        audio_tracks: { type: array, items: { type: object, additionalProperties: true } }
        chapters: { type: array, items: { type: object, additionalProperties: true } }
        advertising:
          type: object
          description: Safe placement descriptors plus a resolve URL. Resolve shortly before an ad break; playback-session creation does not fetch remote VAST documents.
          additionalProperties: true
        capabilities: { $ref: '#/components/schemas/PlaybackCapabilities' }
        progress:
          type: object
          properties:
            update_url: { type: string, format: uri }
            minimum_interval_seconds: { type: integer, const: 10 }
            completion_threshold_percent: { type: integer, const: 95 }
    CaptionTrack:
      type: object
      required: [id, url, format, mime_type, language, label, default]
      additionalProperties: false
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        format: { type: string, enum: [srt, webvtt] }
        mime_type: { type: string, enum: [application/x-subrip, text/vtt] }
        language: { type: [string, 'null'] }
        label: { type: [string, 'null'] }
        default: { type: boolean }
    PlaybackEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PlaybackSession' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    ReceiverPlaybackRequest:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target: { type: string, const: google_cast }
        source_id: { type: [string, 'null'], maxLength: 100 }
        position_seconds: { type: [number, 'null'], minimum: 0, maximum: 604800 }
    ReceiverPlaybackSource:
      type: object
      additionalProperties: false
      required: [id, url, mime_type, stream_type]
      properties:
        id: { type: string }
        url:
          type: string
          format: uri
          description: Bearer-free receiver URL. Server-issued query signatures are scoped to this asset and expire at the manifest expiration; direct external sources are accepted only without a query or fragment and are treated as permanent.
        mime_type: { type: string, enum: [video/mp4, application/vnd.apple.mpegurl, application/dash+xml] }
        stream_type: { type: string, enum: [buffered, live] }
    ReceiverCaptionTrack:
      type: object
      additionalProperties: false
      required: [id, url, mime_type, language, label, default]
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        mime_type: { type: string, const: text/vtt }
        language: { type: [string, 'null'] }
        label: { type: string }
        default: { type: boolean }
    ReceiverPlaybackMetadata:
      type: object
      additionalProperties: false
      required: [media_id, video_id, content_type, title, subtitle, duration_seconds, live]
      properties:
        media_id: { type: string }
        video_id: { type: integer }
        content_type: { type: string, enum: [video, short, replay] }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        duration_seconds: { type: [integer, 'null'], minimum: 0 }
        live: { type: boolean, const: false }
    ReceiverPlaybackManifest:
      type: object
      additionalProperties: false
      required: [receiver_session_id, target, castable, reason, issued_at, expires_at, source, captions, poster_url, metadata, advertising]
      properties:
        receiver_session_id: { type: string, format: uuid }
        target: { type: string, const: google_cast }
        castable: { type: boolean }
        reason:
          type: [string, 'null']
          enum: [receiver_origins_not_configured, no_receiver_compatible_source, protected_source_not_signable, external_source_expiry_unknown, duration_required_for_expiring_receiver_url, duration_exceeds_receiver_url_lifetime, source_origin_not_allowed, null]
        issued_at: { type: string, format: date-time }
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Common expiry for receiver-specific protected or storage-provider URLs; null only when returned assets are permanent public URLs.
        source:
          oneOf:
            - $ref: '#/components/schemas/ReceiverPlaybackSource'
            - type: 'null'
        captions: { type: array, items: { $ref: '#/components/schemas/ReceiverCaptionTrack' } }
        poster_url: { type: [string, 'null'], format: uri }
        metadata: { $ref: '#/components/schemas/ReceiverPlaybackMetadata' }
        advertising:
          type: object
          additionalProperties: false
          required: [mode, reason]
          properties:
            mode: { type: string, const: none }
            reason: { type: string, const: default_receiver_has_no_playhub_ad_integration }
    ReceiverPlaybackEnvelope:
      type: object
