    parameters:
      - $ref: '#/components/parameters/UploadSessionId'
    post:
      tags: [Uploads]
      operationId: completeUploadSession
      summary: Assemble an upload and enqueue video processing
      description: All chunks must exist. Shorts require portrait dimensions and a duration of at most 60 seconds. Processing is asynchronous.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/UploadComplete' }
      responses:
