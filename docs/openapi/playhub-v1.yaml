        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Account]
      operationId: deleteAccountAvatar
      summary: Remove the account and channel avatar
      security: [{ bearerAuth: [] }]
      responses:
