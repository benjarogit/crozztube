          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  maxLength: 80
                role:
                  type: string
                  enum:
                    - guest
                    - cohost
              additionalProperties: false
      description: Owner-only and participants must be enabled.

  /live-streams/{liveStream}/participant-requests/{participantRequest}:
    parameters:
      - $ref: "#/components/parameters/LiveStreamSlug"
      - name: participantRequest
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags:
        - Live
      operationId: respondLiveParticipantRequest
      summary: Accept or decline a scoped stage request
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoritative server response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveParticipantResultEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum:
                    - accepted
                    - declined
              additionalProperties: false
      description: Owner/moderator only. Request must belong to this stream and still be pending. Guest grant permissions are
        reauthorized on join.

  /live-streams/{liveStream}/participants/action:
    parameters:
      - $ref: "#/components/parameters/LiveStreamSlug"
    post:
      tags:
        - Live
      operationId: moderateLiveParticipant
      summary: Mute a published stage track or remove its participant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoritative server response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveActionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - identity
              properties:
                action:
                  type: string
                  enum:
                    - mute_track
                    - request_camera
                    - remove
                identity:
                  type: string
                  maxLength: 160
                  pattern: ^[A-Za-z0-9._-]+$
                track_sid:
                  type:
                    - string
                    - "null"
                  maxLength: 160
                user_id:
                  type:
                    - integer
                    - "null"
                  minimum: 1
              additionalProperties: false
      description: Owner/moderator only. Host protection and participant/track/account ownership are checked server-side;
        mute_track and request_camera require track_sid. request_camera requires a muted camera
        owned by a participant who can still publish video, and sends only a targeted, expiring
        request for participant approval. It never remotely enables a camera.

  /live-streams/{liveStream}/moderators:
    parameters:
      - $ref: "#/components/parameters/LiveStreamSlug"
    post:
      tags:
        - Live
      operationId: addLiveModerator
      summary: Assign a moderator and notify the real user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Existing moderator assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModeratorEnvelope"
        "201":
          description: New assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModeratorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  maxLength: 80
              additionalProperties: false
      description: Owner only; existing assignments do not resend notifications.

  /live-streams/{liveStream}/moderators/{user}:
    parameters:
      - $ref: "#/components/parameters/LiveStreamSlug"
      - name: user
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    delete:
      tags:
        - Live
      operationId: removeLiveModerator
      summary: Remove a moderator assignment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoritative server response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveActionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
      description: Owner only.

  /live-streams/{liveStream}/users/{user}/restrictions/{type}:
    parameters:
      - $ref: "#/components/parameters/LiveStreamSlug"
      - name: user
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum:
            - stream
            - chat
    delete:
      tags:
        - Live
      operationId: removeLiveViewerRestriction
      summary: Remove a stream or chat restriction
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoritative server response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveActionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
      description: Owner/moderator only.

  /live-streams/{liveStream}/engagement:
    parameters:
      - $ref: "#/components/parameters/LiveStreamSlug"
    put:
      tags:
        - Live
      operationId: updateLiveEngagement
      summary: Update configured pinned text and alerts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoritative server response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStreamActionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveEngagementSettings"
      description: Owner only. Feature flags and label limits are server-authoritative.

  /live-streams/{liveStream}/chat-settings:
    parameters:
      - $ref: "#/components/parameters/LiveStreamSlug"
    put:
      tags:
        - Live
      operationId: updateLiveChatSettings
      summary: Update active stream chat rules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoritative server response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStreamActionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveChatSettingsWrite"
      description: Owner only while waiting for source or live. Room participants receive stream_updated.

  /live-streams/{liveStream}/polls/{poll}/voters:
    parameters:
      - $ref: "#/components/parameters/LiveStreamSlug"
      - name: poll
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags:
        - Live
      operationId: getLivePollVoters
      summary: Get paginated voter identities and chosen options
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoritative server response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivePollVotersEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      description: Owner-only. Poll must belong to this stream; identities are not exposed in the public results.

  /live-streams/{liveStream}/rtmp-ingress:
    parameters:
      - $ref: "#/components/parameters/LiveStreamSlug"
    post:
      tags:
        - Live
      operationId: prepareLiveRtmpIngress
      summary: Prepare private OBS RTMP ingest credentials
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoritative server response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveRtmpEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
      description: Owner with live:publish only; RTMP source required. Private no-store publishing secret; never include in
        public room data.

  /live-streams/{liveStream}/ads:
    parameters:
      - $ref: "#/components/parameters/LiveStreamSlug"
    post:
      tags:
        - Live
      operationId: requestLiveAdvertisement
      summary: Request a configured Live ad impression
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoritative server response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveAdEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
      description: Audience-only; excludes stream owner. Real enabled Live ad configuration and server frequency checks are
        required. Separate from native VOD IMA accounting.

  /live-streams/{liveStream}/ads/{impression}/complete:
    parameters:
      - $ref: "#/components/parameters/LiveStreamSlug"
      - name: impression
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Live
      operationId: completeLiveAdvertisement
      summary: Complete an owned Live ad impression once
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoritative server response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveActionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
      description: Requires the authenticated viewer and same stream/impression. Server enforces elapsed duration, 15-minute
        completion window and atomic one-time creator credit. Interrupted ads are not completed.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: PlayHub Sanctum token
      description: Native access token returned once by a v1 mobile or TV authentication flow.

  headers:
    RequestId:
      description: UUID request correlation identifier. Mirrors a valid client-supplied `X-Request-ID`, otherwise generated by the API.
      schema: { type: string, format: uuid }
    ApiVersion:
      description: Numeric API contract version.
      schema: { type: string, const: '1' }
    RateLimitLimit:
      description: Maximum requests allowed in the active rate-limit window.
      schema: { type: integer, minimum: 0 }
    RateLimitRemaining:
      description: Requests remaining in the active rate-limit window.
      schema: { type: integer, minimum: 0 }
    RetryAfter:
      description: Seconds to wait before retrying a rate-limited request.
      schema: { type: integer, minimum: 0 }

  parameters:
    ClientPlatform:
      name: X-PlayHub-Client
      in: header
      required: false
      description: Client platform. Required by native authentication flows and strongly recommended everywhere.
      schema: { $ref: '#/components/schemas/ClientPlatform' }
    ClientPlatformRequiredMobile:
      name: X-PlayHub-Client
      in: header
      required: false
      description: Mobile platform. Required across header/body; when both are sent, this header takes precedence.
      schema: { type: string, enum: [ios, android] }
    ClientPlatformRequiredTv:
      name: X-PlayHub-Client
      in: header
      required: false
      description: TV platform. Required across header/body; when both are sent, this header takes precedence.
      schema: { type: string, enum: [android-tv, tvos, tizen, webos] }
    AppVersion:
      name: X-PlayHub-App-Version
      in: header
      required: false
      description: Installed semantic-like client version, used for minimum-version enforcement.
      schema: { type: string, maxLength: 40, pattern: '^\d+(?:\.\d+){0,3}(?:[-+][0-9A-Za-z.-]+)?$' }
      example: 1.2.0
    OSVersion:
      name: X-PlayHub-OS-Version
      in: header
      required: false
      schema: { type: string, maxLength: 80 }
      example: '18.1'
    DeviceIdRequired:
      name: X-PlayHub-Device-Id
      in: header
      required: false
      description: Stable app-scoped installation identifier. Required across header/body for native authentication; the header takes precedence. Do not use a hardware advertising identifier.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$' }
      example: ios.install.01J8H3ZP7X29
    DeviceModel:
      name: X-PlayHub-Device-Model
      in: header
      required: false
      schema: { type: string, maxLength: 120 }
      example: iPhone 16
    Locale:
      name: X-PlayHub-Locale
      in: header
      required: false
      schema: { type: string, maxLength: 35, pattern: '^[a-zA-Z]{2,3}(?:-[a-zA-Z0-9]{2,8})*$' }
      example: en-US
    Timezone:
      name: X-PlayHub-Timezone
      in: header
      required: false
      description: IANA time-zone name or UTC.
      schema: { type: string, maxLength: 64 }
      example: Europe/Chisinau
    Capabilities:
      name: X-PlayHub-Capabilities
      in: header
      required: false
      description: JSON object, at most 4096 bytes, describing codecs, containers, subtitles, maximum resolution, and client features. Unknown values are ignored.
      schema: { type: string, maxLength: 4096 }
      example: '{"video":{"codecs":["h264"],"containers":["mp4"],"max_resolution":"1080p"},"audio":{"codecs":["aac"]},"subtitle_formats":["webvtt"],"features":{"airplay":true,"picture_in_picture":true}}'
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    PerPage30:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 30, default: 12 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 1000 }
    HomeSection:
      name: section
      in: path
      required: true
      schema: { type: string, enum: [recommended, trending, latest, shorts, live, upcoming, replay, continue-watching, subscriptions] }
    SocialProvider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google, facebook, apple] }
    DeviceSessionId:
      name: deviceSession
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlatformVersion:
      name: platformAppVersion
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ClientPlatform' }
    VideoSlug:
      name: video
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 190 }
    ShortSlug:
      name: short
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 190 }
    CommentId:
      name: comment
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    CommunityPostId:
      name: communityPost
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ConversationId:
      name: conversation
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    UserId:
      name: user
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    LiveStreamSlug:
      name: liveStream
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 190 }
    PollId:
      name: poll
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ChannelSlug:
      name: channel
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 190 }
    PlaylistId:
      name: playlist
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ImpressionId:
      name: impression
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    PushDeviceId:
      name: pushDevice
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationId:
      name: notification
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    UploadSessionId:
      name: uploadSession
      in: path
      required: true
      schema: { type: string, format: uuid }

  requestBodies:
    SafetyReport:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              reason: { type: string, maxLength: 1000 }
    EmailChallenge:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email, maxLength: 190 }
          example: { email: viewer@example.com }
    PhoneChallenge:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phone]
            properties:
              phone: { type: string, maxLength: 32 }
              phone_country_code: { type: [string, 'null'], maxLength: 8 }
              phone_country_iso: { type: [string, 'null'], minLength: 2, maxLength: 2 }
          example: { phone: '+37368123456', phone_country_code: '+373', phone_country_iso: MD }
    NativeLogin:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NativeLoginRequest' }
          example:
            login: viewer@example.com
            password: correct-horse-battery-staple
            platform: ios
            device_id: ios.install.01J8H3ZP7X29
            device_name: My iPhone
            app_version: 1.2.0
    SessionRefresh:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NativeSessionRefreshRequest' }
          example:
            refresh_token: 1294bc3b-0dd1-4e93-a44a-07a0dc429216.AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            platform: ios
            device_id: ios.install.01J8H3ZP7X29
            device_name: My iPhone
            app_version: 1.2.1
    NativeRegister:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NativeRegisterRequest' }
    ConfirmRegistration:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/NativeDeviceContextRequest'
              - type: object
                required: [email, code]
                properties:
                  email: { type: string, format: email, maxLength: 190 }
                  code: { type: string, pattern: '^\d{4,8}$' }
    SocialExchange:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/NativeDeviceContextRequest'
              - type: object
                required: [code, code_verifier]
                properties:
                  code: { type: string, minLength: 48, maxLength: 48 }
                  code_verifier: { type: string, minLength: 43, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$' }
    ForgotPassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            anyOf: [{ required: [email] }, { required: [phone] }]
            properties:
              email: { type: [string, 'null'], format: email, maxLength: 190 }
              phone: { type: [string, 'null'], maxLength: 32 }
              phone_country_code: { type: [string, 'null'], maxLength: 8 }
              phone_country_iso: { type: [string, 'null'], minLength: 2, maxLength: 2 }
    ResetPassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token, password, password_confirmation]
            anyOf: [{ required: [email] }, { required: [phone] }]
            properties:
              email: { type: [string, 'null'], format: email, maxLength: 190 }
              phone: { type: [string, 'null'], maxLength: 32 }
              token: { type: string, pattern: '^\d{6}$' }
              password: { type: string, minLength: 6 }
              password_confirmation: { type: string }
    TvAuthorizationCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: Platform and device ID are required across this body and the equivalent PlayHub headers.
            properties:
              platform: { type: string, enum: [android-tv, tvos, tizen, webos] }
              device_id: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$' }
              device_name: { type: [string, 'null'], maxLength: 120 }
              app_version: { type: [string, 'null'], maxLength: 40 }
              os_version: { type: [string, 'null'], maxLength: 80 }
    TvAuthorizationPoll:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [device_code]
            properties:
              device_code: { type: string, minLength: 40, maxLength: 255, writeOnly: true }
    TvAuthorizationApprove:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [user_code]
            properties:
              user_code: { type: string, maxLength: 16, pattern: '^[A-Za-z0-9 -]+$' }
          example: { user_code: AB12-CD34 }
    SessionRename:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [device_name]
            properties:
              device_name: { type: string, maxLength: 120 }
    PlatformVersionUpdate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlatformVersionWrite' }
    WatchProgress:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [event_id, position_seconds]
            properties:
              event_id: { type: string, format: uuid, description: Unique client event ID used to deduplicate retries. }
              position_seconds: { type: number, minimum: 0, maximum: 604800 }
              duration_seconds: { type: [number, 'null'], minimum: 1, maximum: 604800 }
              state: { type: [string, 'null'], enum: [started, playing, paused, completed, restarted, null] }
              occurred_at: { type: [string, 'null'], format: date-time }
          example:
            event_id: 58d6e305-7acf-430a-8235-f61ce407c3b1
            position_seconds: 127.5
            duration_seconds: 1800
            state: playing
            occurred_at: '2026-09-12T12:00:00Z'
    CommentCreate:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              body: { type: [string, 'null'], maxLength: 2000 }
              parent_id: { type: [integer, 'null'], minimum: 1 }
              sticker_id: { oneOf: [{ $ref: '#/components/schemas/StickerSelectionId' }, { type: 'null' }] }
              images:
                type: array
                maxItems: 4
                items: { type: string, format: binary }
          encoding:
            images: { style: form, explode: true }
        application/json:
          schema:
            type: object
            description: JSON is suitable for text or sticker comments. Use multipart for images.
            properties:
              body: { type: [string, 'null'], maxLength: 2000 }
              parent_id: { type: [integer, 'null'], minimum: 1 }
              sticker_id: { oneOf: [{ $ref: '#/components/schemas/StickerSelectionId' }, { type: 'null' }] }
    CommentUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [body]
            properties:
              body: { type: string, minLength: 1, maxLength: 2000 }
    NewPrivateMessage:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [recipient_id, body]
            properties:
              recipient_id: { type: integer, minimum: 1 }
              body: { type: string, minLength: 1, maxLength: 5000 }
        multipart/form-data:
          schema:
            type: object
            required: [recipient_id]
            properties:
              recipient_id: { type: integer, minimum: 1 }
              body: { type: string, maxLength: 5000 }
              images: { type: array, maxItems: 4, items: { type: string, format: binary } }
          encoding:
            images: { style: form, explode: true }
    PrivateMessage:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [body]
            properties:
              body: { type: string, minLength: 1, maxLength: 5000 }
        multipart/form-data:
          schema:
            type: object
            properties:
              body: { type: string, maxLength: 5000 }
              images: { type: array, maxItems: 4, items: { type: string, format: binary } }
          encoding:
            images: { style: form, explode: true }
    LiveStreamWrite:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LiveStreamWrite' }
    LiveSchedule:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, scheduled_at]
            properties:
              title: { type: string, maxLength: 160 }
              scheduled_at: { type: string, format: date-time }
    LiveThumbnail:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [thumbnail]
            properties:
              thumbnail: { type: string, format: binary, description: "JPEG, PNG, or WebP. Maximum size comes from live settings." }
              only_if_missing: { type: boolean, default: false }
    LivePreflight:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [camera_permission, microphone_permission]
            properties:
              camera_permission: { type: string, enum: [granted, denied, prompt, unavailable] }
              microphone_permission: { type: string, enum: [granted, denied, prompt, unavailable] }
              camera_label: { type: [string, 'null'], maxLength: 160 }
              microphone_label: { type: [string, 'null'], maxLength: 160 }
              width: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
              height: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
              frame_rate: { type: [number, 'null'], minimum: 1, maximum: 240 }
              upload_mbps: { type: [number, 'null'], minimum: 0, maximum: 100000 }
              round_trip_ms: { type: [number, 'null'], minimum: 0, maximum: 60000 }
    LiveMessage:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [body]
            properties:
              body: { type: string, minLength: 1, maxLength: 1000 }
    PollVote:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [option_id]
            properties:
              option_id: { type: integer, minimum: 1 }
    LiveParticipationRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [media_mode, identity]
            properties:
              media_mode: { type: string, enum: [audio, audio_video] }
              identity: { type: string, maxLength: 160, pattern: '^[A-Za-z0-9._-]+$' }
    LiveParticipationLeave:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [identity]
            properties:
              identity: { type: string, maxLength: 160, pattern: '^[A-Za-z0-9._-]+$' }
    PlaylistCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlaylistWrite' }
    PlaylistUpdate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlaylistPatch' }
    AdResolve:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [video_id]
            properties:
              video_id: { type: integer, minimum: 1 }
              ad_ids:
                type: array
                maxItems: 8
                items: { type: string, maxLength: 80 }
    AdImpressionComplete:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string, maxLength: 255, writeOnly: true }
    AccountProfile:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, minLength: 2, maxLength: 80 }
              username: { type: string, minLength: 3, maxLength: 40, pattern: '^[A-Za-z0-9_.]+$' }
              email: { type: string, format: email, maxLength: 255 }
              gender: { type: [string, 'null'], enum: [male, female, null] }
              date_of_birth: { type: [string, 'null'], format: date }
              channel_name: { type: string, minLength: 2, maxLength: 120 }
              channel_slug: { type: string, minLength: 3, maxLength: 140, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
              bio: { type: [string, 'null'], maxLength: 160 }
              about: { type: [string, 'null'], maxLength: 10000 }
    AccountSettings:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AccountSettingsWrite' }
    Avatar:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [avatar]
            properties:
              avatar: { type: string, format: binary, description: "JPEG, PNG, or WebP; maximum 5 MiB." }
    Cover:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [cover]
            properties:
              cover: { type: string, format: binary, description: "JPEG, PNG, or WebP; maximum 5 MiB and 8192 pixels per dimension." }
    PasswordUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [current_password, password, password_confirmation]
            properties:
              current_password: { type: string, writeOnly: true }
              password: { type: string, minLength: 8, writeOnly: true }
              password_confirmation: { type: string, writeOnly: true }
    TwoFactorSetup:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [two_factor_method]
            properties:
              two_factor_method: { type: string, enum: [email, phone] }
              two_factor_phone: { type: [string, 'null'], maxLength: 32 }
    TwoFactorEnable:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TwoFactorCode' }
    TwoFactorDisable:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TwoFactorCode' }
    AccountDelete:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [confirmation]
            properties:
              confirmation: { type: string, const: DELETE }
              current_password: { type: [string, 'null'], maxLength: 255, writeOnly: true }
    PushDevice:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PushDeviceWrite' }
          examples:
            android:
              value: { provider: fcm, platform: android, environment: production, token: example-fcm-registration-token-1234, device_id: android.install.01J8H4 }
            iosProduction:
              value: { provider: apns, platform: ios, environment: production, token: 0123456789abcdef0123456789abcdef, device_id: ios.install.01J8H3 }
    NotificationSettings:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NotificationPreferences' }
    UploadSessionCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UploadSessionCreate' }
          example:
            file_name: launch-trailer.mp4
            file_size: 16777216
            mime_type: video/mp4
            chunk_size: 8388608
            total_chunks: 2
    UploadChunk:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [index, chunk]
            properties:
              index: { type: integer, minimum: 0, description: Zero-based chunk index. }
              chunk: { type: string, format: binary }
    UploadComplete:
      required: true
      content:
        multipart/form-data:
          schema: { $ref: '#/components/schemas/UploadCompleteWrite' }
        application/json:
          schema:
            $ref: '#/components/schemas/UploadCompleteWrite'
          description: Use multipart when sending a thumbnail or caption file.

  schemas:
    BuildLicenseRequest:
      type: object
      required: [license_key, api_base_url, platform, application_id, app_version, build_nonce]
      properties:
        license_key:
          type: string
          minLength: 1
          maxLength: 48
          writeOnly: true
          description: Existing CodeCanyon purchase code or PlayHub store license; build-time credential only.
        api_base_url:
          type: string
          format: uri
          maxLength: 2048
          description: Public HTTPS API for this installation; configured website URL plus /api/v1.
        platform: { type: string, enum: [android, ios] }
        application_id: { type: string, maxLength: 255, pattern: '^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$' }
        app_version: { type: string, maxLength: 40, pattern: '^\d+\.\d+\.\d+$' }
        build_nonce: { type: string, pattern: '^[a-f0-9]{64}$', description: Fresh build-tool nonce echoed to bind this one response. }
    BuildLicenseEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [valid, contract_version, product_slug, domain, api_base_url, platform, application_id, app_version, build_nonce]
          properties:
            valid: { type: boolean, const: true }
            contract_version: { type: integer, const: 1 }
            product_slug: { type: string, const: playhub }
            domain: { type: string, description: Canonical configured installation hostname verified by the authority. }
            api_base_url: { type: string, format: uri }
            platform: { type: string, enum: [android, ios] }
            application_id: { type: string, maxLength: 255 }
            app_version: { type: string, maxLength: 40 }
            build_nonce: { type: string, pattern: '^[a-f0-9]{64}$' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    SafetyPolicy:
      type: object
      required: [version, terms_url, privacy_url, available]
      properties:
        version: { type: string, pattern: '^[a-f0-9]{64}$', description: Opaque digest bound to all saved legal-page locales and publication state. }
        terms_url: { type: string, format: uri }
        privacy_url: { type: string, format: uri }
        available: { type: boolean, description: Both Terms and Privacy were explicitly saved and enabled; not a legal-approval certification. }
        unavailable_documents:
          type: array
          items: { type: string, enum: [terms, privacy] }
          description: Documents requiring administrator publication or correction.
        unavailable_reasons:
          type: object
          additionalProperties: { type: string, enum: [not_published, disabled, incomplete] }
    SafetyPolicyEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { type: object, required: [policy], properties: { policy: { $ref: '#/components/schemas/SafetyPolicy' } } }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    AccountSafetyEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [policy, consent]
          properties:
            policy: { $ref: '#/components/schemas/SafetyPolicy' }
            consent:
              type: object
              required: [required, accepted, accepted_version]
              properties:
                required: { type: boolean }
                accepted: { type: boolean }
                accepted_version: { type: [string, 'null'] }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    UserBlockEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [blocked, blocked_user_id]
          properties:
            blocked: { type: boolean }
            blocked_user_id: { type: integer, minimum: 1 }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    LiveViewerRestriction:
      type: object
      required:
        - user_id
        - name
        - username
        - type
        - reason
        - expires_at
      additionalProperties: false
      properties:
        user_id:
          type: integer
          minimum: 1
        name:
          type:
            - string
            - "null"
        username:
          type:
            - string
            - "null"
        type:
          type: string
          enum:
            - stream
            - chat
        reason:
          type:
            - string
            - "null"
        expires_at:
          type:
            - string
            - "null"
          format: date-time
      description: Only authorized owner/moderator contexts expose current scoped restrictions; expired entries are omitted
        and legacy ban rows normalize to stream.
    LiveAdEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - impression_id
            - ad
          properties:
            impression_id:
              type: string
              format: uuid
            ad:
              type: object
              required:
                - media_url
              properties:
                id:
                  type: string
                media_url:
                  type: string
                  format: uri
                duration:
                  type: number
                  minimum: 0
                tracking:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                      format: uri
                name:
                  type: string
                title:
                  type: string
                engine:
                  type: string
                placement:
                  type: string
                mime_type:
                  type: string
                click_url:
                  type:
                    - string
                    - "null"
                  format: uri
                skip_after:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                offset_seconds:
                  type: number
                gross_cpm:
                  type: number
                  description: Informational only; never controls creator settlement.
        meta:
          $ref: "#/components/schemas/RequestMeta"
    LiveControlEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - server_time
            - stream
            - connection
            - ingress
            - messages
            - pinned_chat_message
            - contributions
            - invites
            - participant_requests
            - moderators
            - viewers
            - metrics
            - capabilities
            - participants
            - restrictions
          properties:
            server_time:
              type: string
              format: date-time
            stream:
              $ref: "#/components/schemas/LiveOwnerStream"
            connection:
              oneOf:
                - $ref: "#/components/schemas/LiveLegacyConnection"
                - type: "null"
            ingress:
              oneOf:
                - $ref: "#/components/schemas/LiveRtmpIngress"
                - type: "null"
            messages:
              type: array
              items:
                $ref: "#/components/schemas/LiveChatMessage"
              maxItems: 100
            pinned_chat_message:
              oneOf:
                - $ref: "#/components/schemas/LiveChatMessage"
                - type: "null"
            contributions:
              type: array
              items:
                $ref: "#/components/schemas/LiveControlContribution"
              maxItems: 30
            invites:
              type: array
              items:
                $ref: "#/components/schemas/LivePerson"
            participant_requests:
              type: array
              items:
                $ref: "#/components/schemas/LiveParticipantRequest"
            moderators:
              type: array
              items:
                $ref: "#/components/schemas/LivePerson"
            viewers:
              type: array
              items:
                $ref: "#/components/schemas/LivePerson"
            capabilities:
              $ref: "#/components/schemas/LiveCapabilities"
            participants:
              type: array
              items:
                $ref: "#/components/schemas/LivePerson"
            restrictions:
              type: array
              items:
                $ref: "#/components/schemas/LiveViewerRestriction"
            metrics:
              type: object
              properties:
                duration_seconds:
                  type: integer
                  minimum: 0
                followers_count:
                  type: integer
                  minimum: 0
                new_followers:
                  type: integer
                  minimum: 0
                chat_messages:
                  type: integer
                  minimum: 0
                contributions_count:
                  type: integer
                  minimum: 0
                contributions_total_cents:
                  type: integer
                  minimum: 0
        meta:
          $ref: "#/components/schemas/RequestMeta"
    LiveControlContribution:
      type: object
      required:
        - id
        - type
        - gross_cents
        - fee_cents
        - net_cents
        - currency
        - status
        - gift
        - super_sticker
        - amount
        - message
        - created_at
        - sender
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - tip
            - super_chat
            - super_sticker
            - gift
        gross_cents:
          type: integer
          minimum: 0
        fee_cents:
          type: integer
          minimum: 0
        net_cents:
          type: integer
          minimum: 0
        currency:
          type: string
        status:
          type: string
        gift:
          oneOf:
            - $ref: "#/components/schemas/LiveContributionAsset"
            - type: "null"
        super_sticker:
          oneOf:
            - $ref: "#/components/schemas/LiveContributionAsset"
            - type: "null"
        amount:
          type: string
        message:
          type: string
        created_at:
          type:
            - string
            - "null"
          format: date-time
        sender:
          $ref: "#/components/schemas/LiveChatUser"
      additionalProperties: false
    LiveRtmpEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - message
            - server_time
            - stream
            - connection
            - ingress
          properties:
            message:
              type: string
            server_time:
              type: string
              format: date-time
            stream:
              $ref: "#/components/schemas/LiveOwnerStream"
            connection:
              $ref: "#/components/schemas/LiveLegacyConnection"
            ingress:
              $ref: "#/components/schemas/LiveRtmpIngress"
            preview_connection:
              $ref: "#/components/schemas/LiveKitJoin"
              description: Optional private owner-only, hidden subscriber-only RTMP preview grant. This normalized grant never
                publishes and is never exposed in a public room.
        meta:
          $ref: "#/components/schemas/RequestMeta"
    LiveStreamActionEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - message
            - stream
          properties:
            message:
              type: string
            stream:
              $ref: "#/components/schemas/LiveOwnerStream"
            server_time:
              type: string
              format: date-time
            connection:
              oneOf:
                - $ref: "#/components/schemas/LiveLegacyConnection"
                - type: "null"
            ingress:
              oneOf:
                - $ref: "#/components/schemas/LiveRtmpIngress"
                - type: "null"
        meta:
          $ref: "#/components/schemas/RequestMeta"
    LiveOwnerStream:
      type: object
      required:
        - id
        - uuid
        - slug
        - title
        - description
        - tags
        - creator
        - visibility
        - status
        - source_type
        - appearance
        - stream_settings
        - monetization_settings
        - engagement_settings
        - polls
        - contribution_summary
        - recording
      properties:
        id:
          type: integer
          minimum: 1
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        category_id:
          type:
            - integer
            - "null"
          minimum: 1
        category:
          oneOf:
            - $ref: "#/components/schemas/LiveCategory"
            - type: "null"
        creator:
          type: object
          required:
            - id
            - user_id
            - channel_id
            - name
            - slug
            - bio
            - verified
            - avatar_url
            - followers_count
          properties:
            id:
              type: integer
              minimum: 1
            user_id:
              type: integer
              minimum: 1
            channel_id:
              type: integer
              minimum: 1
            name:
              type:
                - string
                - "null"
            slug:
              type:
                - string
                - "null"
            bio:
              type: string
            verified: &a1
              type: boolean
            avatar_url:
              type:
                - string
                - "null"
              format: uri-reference
            followers_count:
              type: integer
              minimum: 0
            is_subscribed: *a1
        visibility:
          type: string
          enum:
            - public
            - unlisted
            - private
        status:
          type: string
          enum:
            - draft
            - scheduled
            - waiting-for-source
            - live
            - ended
        source_type:
          type: string
          enum:
            - webcam
            - rtmp
        thumbnail_url:
          type:
            - string
            - "null"
          format: uri-reference
        appearance:
          type: object
          properties:
            accent_color:
              type:
                - string
                - "null"
              pattern: ^#[0-9a-fA-F]{6}$
            overlay_theme:
              type:
                - string
                - "null"
              enum:
                - minimal
                - creator_dark
                - clean_light
                - null
        stream_settings:
          type: object
          properties:
            quality:
              type:
                - string
                - "null"
            latency_mode:
              type:
                - string
                - "null"
            enable_dvr:
              type:
