    post:
      tags: [Live]
      operationId: joinLiveStreamAsCreator
      summary: Issue a short-lived LiveKit publisher token
      description: Requires stream ownership and `live:publish`; TV tokens and TV client headers are rejected. The token may publish and subscribe but may not publish arbitrary data.
