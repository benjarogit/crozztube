            application/json:
              schema:
                $ref: "#/components/schemas/LiveStreamActionEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /live-streams/{liveStream}/control-room:
    parameters:
      - $ref: "#/components/parameters/LiveStreamSlug"
    get:
      tags:
        - Live
      operationId: getLiveControlRoom
      summary: Get authorized owner or moderator control state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoritative server response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveControlEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
      description: Owner/moderator only while waiting for source or live. Ingest credentials and optional connect grant belong
        exclusively to the owner. Private no-store response.
      parameters:
        - name: connect
          in: query
          schema:
            type: boolean
            default: false

  /profiles/{channel}:
    parameters:
      - $ref: '#/components/parameters/ChannelSlug'
    get:
      tags: [Profiles]
      operationId: getProfile
      summary: Get a visible creator profile
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200': { $ref: '#/components/responses/Profile' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /mentions/{handle}:
    get:
      tags: [Profiles]
      operationId: resolveMention
      summary: Resolve a mentioned username or channel slug to a visible profile
      description: Case-insensitive exact match without the leading @. Returns 404 for unknown, hidden, channel-less, or ambiguous handles rather than guessing between a username and another person's channel slug.
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - name: handle
          in: path
          required: true
          schema: { type: string, minLength: 2, maxLength: 40, pattern: '^[A-Za-z0-9_.-]+$' }
      responses:
        '200': { $ref: '#/components/responses/MentionResolution' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /profiles/{channel}/videos:
    parameters:
      - $ref: '#/components/parameters/ChannelSlug'
    get:
      tags: [Profiles]
      operationId: listProfileVideos
      summary: List a profile's public videos
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { name: content_type, in: query, schema: { type: string, enum: [all, videos, shorts, replays], default: all } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { $ref: '#/components/responses/VideoList' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /profiles/{channel}/playlists:
    parameters:
      - $ref: '#/components/parameters/ChannelSlug'
    get:
      tags: [Profiles]
      operationId: listProfilePlaylists
      summary: List a profile's visible playlists
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { $ref: '#/components/responses/PlaylistList' }
        default: { $ref: '#/components/responses/Error' }

  /profiles/{channel}/subscribers:
    parameters:
      - $ref: '#/components/parameters/ChannelSlug'
    get:
      tags: [Profiles]
      operationId: listProfileSubscribers
      summary: List visible subscribers
      description: Lists subscribers whose own profiles are public and active. The channel owner's `showSubscriptions` preference hides channels they follow, not people subscribed to their channel.
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { $ref: '#/components/responses/List' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /profiles/{channel}/reports:
    parameters:
      - $ref: '#/components/parameters/ChannelSlug'
    post:
      tags: [Profiles]
      operationId: reportProfile
      summary: Report a public profile for review
      description: Idempotently records one report per viewer and profile. Own profiles cannot be reported. No reason field is defined by the existing report model.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /profiles/{channel}/subscription:
    parameters:
      - $ref: '#/components/parameters/ChannelSlug'
    put:
      tags: [Profiles]
      operationId: subscribeProfile
      summary: Subscribe to a creator idempotently
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Engagement' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Profiles]
      operationId: unsubscribeProfile
      summary: Unsubscribe from a creator idempotently
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Engagement' }
        default: { $ref: '#/components/responses/Error' }

  /playlists:
    post:
      tags: [Playlists]
      operationId: createPlaylist
      summary: Create a playlist
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/PlaylistCreate' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }

  /playlists/{playlist}:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [Playlists]
      operationId: getPlaylist
      summary: Get a visible playlist and paginated videos
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: sort, in: query, schema: { type: string, enum: [playlist, newest], default: playlist } }
      responses:
        '200': { $ref: '#/components/responses/Playlist' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Playlists]
      operationId: updatePlaylist
      summary: Update an owned playlist
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/PlaylistUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Playlists]
      operationId: deletePlaylist
      summary: Delete an owned playlist
      security: [{ bearerAuth: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /playlists/{playlist}/videos/{video}:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
      - $ref: '#/components/parameters/VideoSlug'
    put:
      tags: [Playlists]
      operationId: addVideoToPlaylist
      summary: Add a viewable video to an owned playlist idempotently
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Playlists]
      operationId: removeVideoFromPlaylist
      summary: Remove a video from an owned playlist idempotently
      description: 'A slug outside the owned playlist and a nonexistent slug both succeed with `video_id: null`; unrelated private videos are not resolved.'
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Error' }

  /search:
    get:
      tags: [Search]
      operationId: search
      summary: Search videos, Shorts, creators, live streams, playlists, or categories
      description: Limited to 60/minute per user or IP. Whitespace-only queries are rejected. `all` returns compact video, Short, creator, live, and category sections; a specific type returns a paginated list. Filters apply to videos and shorts types only.
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
        - { name: type, in: query, schema: { type: string, enum: [all, videos, shorts, creators, users, live, playlists, categories], default: all } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, latest, popular], default: relevance } }
        - { name: upload_date, in: query, description: "Filter videos/shorts by publish date range.", schema: { type: string, enum: [hour, today, week, month, year] } }
        - { name: duration, in: query, description: "Filter videos/shorts by duration: short (<4 min), medium (4–20 min), long (>20 min).", schema: { type: string, enum: [short, medium, long] } }
        - { name: resolution, in: query, description: "Filter videos/shorts by the website rendition labels.", schema: { type: string, enum: [hd, 4k] } }
        - { name: features, in: query, description: "Filter videos/shorts by captions or made-for-kids metadata.", schema: { type: string, enum: [captions, kids] } }
        - { name: category, in: query, description: "Filter videos/shorts by category slug.", schema: { type: string, maxLength: 120 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { $ref: '#/components/responses/Search' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /search/suggestions:
    get:
      tags: [Search]
      operationId: getSearchSuggestions
      summary: Get short-lived search suggestions
      description: Returns up to 10 suggestions (public video titles, channel names, and enabled category names) matching the query. Cached server-side for 30 seconds.
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 80 } }
      responses:
        '200': { $ref: '#/components/responses/SearchSuggestions' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /ads/configuration:
    get:
      tags: [Advertising]
      operationId: getAdConfiguration
      summary: Get public player ad configuration
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Error' }

  /ads/resolve:
    post:
      tags: [Advertising]
      operationId: resolveAds
      summary: Resolve eligible ads for a video playback
      description: Applies authoritative server-side eligibility and frequency rules. Resolution is limited to 10/minute and 60/hour per user or source IP. Anonymous viewers can receive playable ads but never payout-bearing impression credentials.
      security: [{ bearerAuth: [] }, {}]
      requestBody: { $ref: '#/components/requestBodies/AdResolve' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }

  /ads/impressions/{impression}/complete:
    parameters:
      - $ref: '#/components/parameters/ImpressionId'
    post:
      tags: [Advertising]
      operationId: completeAdImpression
      summary: Complete a signed ad impression
      description: Idempotently completes a valid signed impression after the required play time. Requires the original authenticated viewer and the `playback:read` ability; the response never exposes settlement amounts. Completion is limited to 60/minute and 300/hour per user.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/AdImpressionComplete' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /account:
    get:
      tags: [Account]
      operationId: getAccount
      summary: Get the caller's complete account
      description: Requires the `account:read` native token ability.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Account]
      operationId: deleteAccount
      summary: Permanently delete the caller's account
      description: Requires `account:write`, literal confirmation `DELETE`, and the current password for local/password accounts. The operation deletes account-owned data and revokes sessions and tokens.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/AccountDelete' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }

  /account/profile:
    patch:
      tags: [Account]
      operationId: updateAccountProfile
      summary: Partially update identity and channel profile fields
      description: Changing email clears email verification. Requires `account:write`.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/AccountProfile' }
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }

  /account/settings:
    patch:
      tags: [Account]
      operationId: updateAccountSettings
      summary: Partially merge account preferences
      description: Requires `account:write`.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/AccountSettings' }
      responses:
