      responses:
        '200': { $ref: '#/components/responses/PushList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Push]
      operationId: registerPushDevice
      summary: Register or refresh an encrypted push token
      description: FCM supports Android production registrations. APNs supports iOS sandbox and production registrations. The raw token is accepted only on write and is never returned.
