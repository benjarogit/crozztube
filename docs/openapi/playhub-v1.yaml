openapi: 3.1.0
info:
  title: PlayHub Mobile and TV API
  version: 1.0.0
  summary: First-party API for PlayHub mobile, television, and companion clients.
  description: |
    The versioned PlayHub API is the supported contract for iOS, Android, Android TV,
    tvOS, Samsung Tizen, and LG webOS clients. All JSON success responses use
    `{ "data": ..., "meta": { "request_id": "..." } }`. Errors use
    `{ "error": { "code", "message", "status", "request_id", "validation"? } }`.

    Public catalogue endpoints accept an optional bearer token and return viewer-specific
    fields when it is valid. Protected endpoints require a native Sanctum token issued by
    a v1 login, registration, social handoff, or TV device authorization. Native bearer
    tokens are intentionally rejected by legacy, unversioned API routes.

    Unless an operation states a tighter policy, requests share a 240 requests/minute
    limit per authenticated user or source IP. Laravel rate-limit headers are returned.
    A 429 response can include `Retry-After`.

    Authenticated UGC writes require an explicit receipt for the current saved Terms
    and Privacy revision. Missing/stale receipts return 403 `ugc_terms_required`;
    clients must not sign out or automatically replay the failed write. Public
    watching, legal/safety reads, reporting, blocking, logout and deletion remain
    available. Personal blocks are directional records with bidirectional content
    and interaction restrictions; they are separate from notification mutes.
  contact:
    name: PlayHub API maintainers
  license:
    name: Proprietary
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://playhub.example/api/v1
    description: Production placeholder; replace with the installed PlayHub origin.
  - url: /api/v1
    description: Same-origin relative URL.
tags:
  - { name: Build licensing, description: "Owner-side production compilation checks; never called by installed apps." }
  - { name: Bootstrap, description: "Runtime configuration, capabilities, and minimum client versions." }
  - { name: Authentication, description: "Native sign-in, registration, recovery, social handoff, and user identity." }
  - { name: TV pairing, description: "OAuth-style device authorization for television clients." }
  - { name: Sessions, description: "Native device session inventory and revocation." }
  - { name: Admin versions, description: "Administrator-managed platform support and upgrade policy." }
  - { name: Home, description: "Device-aware home rows." }
  - { name: Catalogue, description: "Categories and languages." }
  - { name: Videos, description: "Video discovery, details, playback, progress, and engagement." }
  - { name: Shorts, description: "Cursor-paginated short-form video." }
  - { name: Comments, description: "Video comments, replies, moderation, and likes." }
  - { name: Community, description: "Existing creator community posts, likes, and comments." }
  - { name: Messages, description: "Private conversations and messages for authenticated mobile users." }
  - { name: Mutes, description: "Notification mutes for individual users; mutes do not block content or messages." }
  - { name: Live, description: "Live directory, LiveKit joins, chat, polls, and creator controls." }
  - { name: Profiles, description: "Public creator profiles and subscriptions." }
  - { name: Playlists, description: "Public and user-managed playlists." }
  - { name: Search, description: "Unified search and suggestions." }
  - { name: Advertising, description: "Native ad configuration and impression lifecycle." }
  - { name: Account, description: "Account profile, settings, security, avatar, and deletion." }
  - { name: Push, description: "APNs and FCM device registrations." }
  - { name: Library, description: "Watch later, purchases, likes, subscriptions, and playlists." }
  - { name: History, description: "Watch history and idempotent progress updates." }
  - { name: Notifications, description: "In-app notifications and preferences." }
  - { name: Uploads, description: "Creator chunked upload sessions and asynchronous processing." }
paths:
  /build/license/verify:
    post:
      tags: [Build licensing]
      operationId: verifyProductionBuildLicense
      summary: Verify the installation's existing PlayHub license before a production compilation
      description: |
        Build-tool endpoint, not an installed-device activation or a separate mobile entitlement.
        Requires no user account: the purchase key is a sensitive build credential supplied only
        in the JSON body, never in a URL, bearer token, generated application or runtime settings.
        Query parameters and non-JSON bodies are rejected. The submitted API must match the
        configured public HTTPS installation URL plus /api/v1 before the fixed existing PlayHub
        licensing authority is contacted. Authority checks use the configured domain, not Host.
        Every compilation request is verified live; no durable success/license cache is created.
        Platform, package, version and nonce are caller-supplied build binding, not entitlement.
        All responses, including failures and throttles, are private no-store. Neither the
        key, upstream receipt, license identity nor raw provider errors are returned or stored.
        Limited to 5/minute and 30/hour per source IP, plus 20/minute and 120/hour across this
        installation using the site's shared rate-limit cache. Failed builds are not retried.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuildLicenseRequest' }
      responses:
        '200':
          description: The existing PlayHub product license verified for the exact build binding; not a reusable signed activation receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildLicenseEnvelope' }
        '403':
          description: The existing licensing authority did not verify the license; no raw provider failure details are exposed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415':
          description: A JSON body is required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: Missing/invalid key or metadata, query parameters, or a production API binding that does not match this installation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: Build verification rate limit exceeded. No additional upstream request is made.
          headers:
            Retry-After: { schema: { type: integer, minimum: 0 } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: This installation is not configured with a public HTTPS website URL or verification is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /safety/policy:
    get:
      tags: [Account]
      operationId: getSafetyPolicy
      summary: Read the published legal revision required before posting
      description: Built-in templates are not owner publication. An unavailable policy never permits posting or acceptance. No-store response.
      responses:
        '200':
          description: Current public revision and legal links.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafetyPolicyEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /account/safety:
    get:
      tags: [Account]
      operationId: getAccountSafety
      summary: Read current account consent status
      security: [{ bearerAuth: [] }]
      description: Requires account:read. Existing and OAuth accounts use the same revision-bound receipt. Private no-store response.
      responses:
        '200':
          description: Current policy and caller-specific receipt status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSafetyEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /account/safety/consent:
    post:
      tags: [Account]
      operationId: acceptCurrentUgcPolicy
      summary: Explicitly accept the exact current saved legal revision
      security: [{ bearerAuth: [] }]
      description: Requires account:write. Idempotent receipt, limited to 60/minute. JSON accepted must be the boolean true. Stale or unavailable revisions return 422; no receipt is created. Private no-store response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_version, accepted]
              properties:
                policy_version: { type: string, pattern: '^[a-f0-9]{64}$' }
                accepted: { type: boolean, const: true }
      responses:
        '200':
          description: Updated account consent status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSafetyEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /account/blocks:
    get:
      tags: [Account]
      operationId: getBlockedUsers
      summary: List actual users personally blocked by the caller
      security: [{ bearerAuth: [] }]
      description: Requires account:read. Does not reveal who blocked the caller. Private no-store response.
      responses:
        '200':
          description: User identities, not channel identities; never private email or credentials.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      users: { type: array, items: { $ref: '#/components/schemas/UserPublic' } }
                  meta: { $ref: '#/components/schemas/RequestMeta' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Account]
      operationId: blockAuthorizedContentAuthor
      summary: Block an authorized resource author using an explicit namespace
      security: [{ bearerAuth: [] }]
      description: Requires account:write, 60/minute. Server resolves actual user identity only after content privacy or message-participant checks. Channel IDs must never be supplied as user IDs. Idempotent; self-block is rejected. No current consent required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id]
              properties:
                target_type: { type: string, enum: [user, channel, video, community_post, comment, message, live_stream] }
                target_id: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Personal block committed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserBlockEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /account/blocks/{user}:
    parameters:
      - { name: user, in: path, required: true, schema: { type: integer, minimum: 1 } }
    delete:
      tags: [Account]
      operationId: removePersonalUserBlock
      summary: Remove only the caller's directional block
      security: [{ bearerAuth: [] }]
      description: Requires account:write, 60/minute. Cannot remove the other user's reciprocal block. Idempotent. Private no-store response.
      responses:
        '200':
          description: Caller block removed; reciprocal restrictions may remain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserBlockEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /community-posts/{id}/reports:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [Community]
      operationId: reportCommunityPost
      summary: Report a visible community post
      security: [{ bearerAuth: [] }]
      description: Requires engagement:write; 10/hour. Reports remain available after personally blocking an author, but original content privacy remains enforced. Reporting own content is rejected. Duplicate reports are idempotent.
      requestBody: { $ref: '#/components/requestBodies/SafetyReport' }
      responses:
        '200': { $ref: '#/components/responses/SafetyReported' }
        default: { $ref: '#/components/responses/Error' }
  /messages/{id}/reports:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [Messages]
      operationId: reportPrivateMessage
      summary: Report an actual private message, not a conversation ID
      security: [{ bearerAuth: [] }]
      description: Requires engagement:write; 10/hour. Only a participant of the owning conversation may report someone else's message. Private no-store response.
      requestBody: { $ref: '#/components/requestBodies/SafetyReport' }
      responses:
        '200': { $ref: '#/components/responses/SafetyReported' }
        default: { $ref: '#/components/responses/Error' }
  /live-streams/{id}/reports:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [Live]
      operationId: reportLiveStream
      summary: Report a visible live stream by numeric ID
      security: [{ bearerAuth: [] }]
      description: Requires engagement:write; 10/hour. Original audience/privacy restrictions apply even after blocking. Private no-store response.
      requestBody: { $ref: '#/components/requestBodies/SafetyReport' }
      responses:
        '200': { $ref: '#/components/responses/SafetyReported' }
        default: { $ref: '#/components/responses/Error' }
  /users/{id}/reports:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [Profiles]
      operationId: reportActualUser
      summary: Report a public or existing-contact actual user
      security: [{ bearerAuth: [] }]
      description: Requires engagement:write; 10/hour. Uses actual user ID, never channel ID. Non-public/non-contact users remain hidden. Own reports are rejected and duplicates are idempotent. No posting consent required.
      requestBody: { $ref: '#/components/requestBodies/SafetyReport' }
      responses:
        '200': { $ref: '#/components/responses/SafetyReported' }
        default: { $ref: '#/components/responses/Error' }
  /admin/safety-reports:
    get:
      tags: [Account]
      operationId: listModerationSafetyReports
      summary: Read the latest 100 community, message and live reports for moderation
      security: [{ bearerAuth: [] }]
      description: Requires account:read plus administrator/moderator authorization. Personal block filters never hide moderation targets. Private no-store response.
      responses:
        '200':
          description: Restricted moderation queue with report reasons and resource references.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { reports: { type: array, items: { type: object } } } }, meta: { $ref: '#/components/schemas/RequestMeta' } } }
        default: { $ref: '#/components/responses/Error' }
  /bootstrap:
    get:
      tags: [Bootstrap]
      operationId: getBootstrap
      summary: Bootstrap a client
      description: Returns branding, feature flags, authentication methods, version enforcement, playback capabilities, and service links. Cacheable privately for 60 seconds and varied by client headers.
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/OSVersion'
        - $ref: '#/components/parameters/DeviceModel'
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Timezone'
        - $ref: '#/components/parameters/Capabilities'
      responses:
        '200': { $ref: '#/components/responses/Bootstrap' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /auth/login-captcha:
    get:
      tags: [Authentication]
      operationId: getLoginCaptcha
      summary: Get a native login captcha challenge
      description: Call after login returns captcha_required. Available independently of the registration captcha policy. Render the returned data-URI image and submit id as captcha_id plus the entered captcha_answer with the next login request. A challenge is consumed after one verification attempt; fetch a new challenge before retrying. No bearer token or browser cookie is required. Limited to 10/minute and 60/hour per IP.
      responses:
        '200':
          description: A fresh single-use captcha challenge. Cache-Control is no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginCaptchaEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /auth/registration-captcha:
    get:
      tags: [Authentication]
      operationId: getRegistrationCaptcha
      summary: Get the current registration captcha
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Error' }

  /auth/registration-captcha/google:
    get:
      tags: [Authentication]
      operationId: showNativeRegistrationGoogleCaptcha
      summary: Open the configured website Google CAPTCHA in the system authentication browser
      description: No session or login credential is created. Only exact native callback destinations are allowed. The web response is handed back using S256 PKCE; registration still validates it with Google.
      parameters:
        - { name: return_to, in: query, required: true, schema: { type: string, maxLength: 200 } }
        - { name: code_challenge, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' } }
      responses:
        '200':
          description: No-store HTTPS security-check page
          content:
            text/html:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /auth/registration-captcha/google/complete:
    post:
      tags: [Authentication]
      operationId: completeNativeRegistrationGoogleCaptcha
      summary: Return a one-time CAPTCHA handoff code to the exact native callback
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [state, google_captcha_token]
              properties:
                state: { type: string, pattern: '^[A-Za-z0-9]{48}$' }
                google_captcha_token: { type: string, maxLength: 4000 }
      responses:
        '302':
          description: Exact allowlisted app callback containing captcha_auth, never the CAPTCHA response token
        default: { $ref: '#/components/responses/Error' }

  /auth/registration-captcha/google/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeNativeRegistrationGoogleCaptcha
      summary: Exchange a one-time handoff with its S256 verifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, code_verifier]
              properties:
                code: { type: string, pattern: '^[A-Za-z0-9]{48}$' }
                code_verifier: { type: string, pattern: '^[A-Za-z0-9._~-]{43,128}$' }
      responses:
        '200':
          description: No-store CAPTCHA response; submit it immediately as google_captcha_token during normal native registration
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [token, expires_in]
                    properties:
                      token: { type: string, maxLength: 4000 }
                      expires_in: { type: integer, minimum: 1, maximum: 90 }
                  meta: { $ref: '#/components/schemas/RequestMeta' }
        default: { $ref: '#/components/responses/Error' }

  /auth/registration-availability:
    get:
      tags: [Authentication]
      operationId: checkRegistrationAvailability
      summary: Check username, email, or phone availability
      parameters:
        - { name: username, in: query, schema: { type: string, minLength: 4, maxLength: 30 } }
        - { name: email, in: query, schema: { type: string, format: email } }
        - { name: phone, in: query, schema: { type: string, maxLength: 32 } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Error' }

  /auth/registration-email-challenge:
    post:
      tags: [Authentication]
      operationId: createRegistrationEmailChallenge
      summary: Send an email registration verification code
      description: Limited to 4/minute and 15/hour per IP, in addition to the global limit.
      requestBody: { $ref: '#/components/requestBodies/EmailChallenge' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /auth/registration-phone-challenge:
    post:
      tags: [Authentication]
      operationId: createRegistrationPhoneChallenge
      summary: Send a phone registration verification code
      description: Limited to 4/minute and 15/hour per IP, in addition to the global limit.
      requestBody: { $ref: '#/components/requestBodies/PhoneChallenge' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /auth/login:
    post:
      tags: [Authentication]
      operationId: nativeLogin
      summary: Sign in an iOS or Android device
      description: Issues a 30-day bearer token and a rotating, device-bound refresh credential. Both plaintext credentials are returned only in this response. Limited to 8/minute and 40/hour per IP plus normalized login identifier.
      parameters:
        - $ref: '#/components/parameters/ClientPlatformRequiredMobile'
        - $ref: '#/components/parameters/DeviceIdRequired'
        - $ref: '#/components/parameters/AppVersion'
      requestBody: { $ref: '#/components/requestBodies/NativeLogin' }
      responses:
        '200': { $ref: '#/components/responses/AuthToken' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshNativeSession
      summary: Silently renew a native mobile or TV session
      description: The refresh credential is bound to the original platform and device ID. A successful request rotates both access and refresh credentials while preserving the device-session ID. Reuse of an already-consumed refresh credential revokes the whole device session. The default access lifetime is 30 days and the sliding refresh lifetime is 180 days. Limited to 15/minute and 120/hour per IP/device key.
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/DeviceIdRequired'
        - $ref: '#/components/parameters/AppVersion'
      requestBody: { $ref: '#/components/requestBodies/SessionRefresh' }
      responses:
        '200': { $ref: '#/components/responses/AuthToken' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /auth/register:
    post:
      tags: [Authentication]
      operationId: nativeRegister
      summary: Register an iOS or Android device user
      description: Registration requirements and verification method are discovered through bootstrap. The token is returned only when registration completes immediately.
      parameters:
        - $ref: '#/components/parameters/ClientPlatformRequiredMobile'
        - $ref: '#/components/parameters/DeviceIdRequired'
        - $ref: '#/components/parameters/AppVersion'
      requestBody: { $ref: '#/components/requestBodies/NativeRegister' }
      responses:
        '201': { $ref: '#/components/responses/AuthToken' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /auth/confirm-registration:
    post:
      tags: [Authentication]
      operationId: confirmNativeRegistration
      summary: Confirm registration and issue a native token
      parameters:
        - $ref: '#/components/parameters/ClientPlatformRequiredMobile'
        - $ref: '#/components/parameters/DeviceIdRequired'
      requestBody: { $ref: '#/components/requestBodies/ConfirmRegistration' }
      responses:
        '200': { $ref: '#/components/responses/AuthToken' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }

  /auth/social/{provider}/redirect:
    get:
      tags: [Authentication]
      operationId: beginNativeSocialLogin
      summary: Begin an OAuth social login handoff
      description: Redirects to the configured provider. `return_to` must exactly match the server allowlist and the code challenge uses PKCE S256. This response is a redirect rather than the JSON envelope.
      parameters:
        - $ref: '#/components/parameters/SocialProvider'
        - { name: intent, in: query, required: false, description: Use the same login or signup intent as the website., schema: { type: string, enum: [login, register], default: login } }
        - { name: return_to, in: query, required: true, schema: { type: string, format: uri }, example: 'playhub://auth/callback' }
        - { name: code_challenge, in: query, required: true, description: Base64url SHA-256 digest of the client verifier., schema: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' } }
      responses:
        '302':
          description: Redirect to the selected OAuth provider.
          headers:
            Location: { schema: { type: string, format: uri } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /auth/social/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeNativeSocialHandoff
      summary: Exchange a one-time social handoff code
      description: The 48-character handoff code is single-use and bound to the PKCE verifier and allowed return URI flow.
      parameters:
        - $ref: '#/components/parameters/ClientPlatformRequiredMobile'
        - $ref: '#/components/parameters/DeviceIdRequired'
      requestBody: { $ref: '#/components/requestBodies/SocialExchange' }
      responses:
        '200': { $ref: '#/components/responses/AuthToken' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }

  /auth/forgot-password:
    post:
      tags: [Authentication]
      operationId: forgotPassword
      summary: Request password recovery
      description: Uses a generic response to reduce account enumeration. Limited to 5/minute per IP.
      requestBody: { $ref: '#/components/requestBodies/ForgotPassword' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /auth/reset-password:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Reset a password using a recovery code
      requestBody: { $ref: '#/components/requestBodies/ResetPassword' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /auth/tv/device-authorizations:
    post:
      tags: [TV pairing]
      operationId: createTvDeviceAuthorization
      summary: Start TV device authorization
      description: Returns a secret device code to poll, a short user code, verification URI, expiry, and minimum polling interval. Limited to 10/minute per IP.
      parameters:
        - $ref: '#/components/parameters/ClientPlatformRequiredTv'
        - $ref: '#/components/parameters/DeviceIdRequired'
      requestBody: { $ref: '#/components/requestBodies/TvAuthorizationCreate' }
      responses:
        '201': { $ref: '#/components/responses/TvAuthorization' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /auth/tv/device-authorizations/token:
    post:
      tags: [TV pairing]
      operationId: pollTvDeviceAuthorization
      summary: Poll a TV device authorization
      description: Poll no faster than the returned interval. Pending, slow-down, rejected, expired, consumed, and invalid states use stable error codes. An approved code is consumed once and returns a TV-scoped bearer token. Limited to 60/minute per source/device key.
      requestBody: { $ref: '#/components/requestBodies/TvAuthorizationPoll' }
      responses:
        '200': { $ref: '#/components/responses/AuthToken' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /auth/tv/device-authorizations/preview:
    post:
      tags: [TV pairing]
      operationId: previewTvDeviceAuthorization
      summary: Preview a TV waiting for approval
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TvAuthorizationApprove' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /auth/tv/device-authorizations/approve:
    post:
      tags: [TV pairing]
      operationId: approveTvDeviceAuthorization
      summary: Approve a TV using its user code
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TvAuthorizationApprove' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        default: { $ref: '#/components/responses/Error' }

  /auth/sessions:
    get:
      tags: [Sessions]
      operationId: listNativeSessions
      summary: List active native device sessions
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/SessionList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        default: { $ref: '#/components/responses/Error' }

  /auth/sessions/current:
    delete:
      tags: [Sessions]
      operationId: revokeCurrentNativeSession
      summary: Sign out the current device
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /auth/sessions/others:
    delete:
      tags: [Sessions]
      operationId: revokeOtherNativeSessions
      summary: Sign out every other native device
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Error' }

  /auth/sessions/all:
    delete:
      tags: [Sessions]
      operationId: revokeAllNativeSessions
      summary: Sign out every native device including the caller
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Error' }

  /auth/sessions/{deviceSession}:
    parameters:
      - $ref: '#/components/parameters/DeviceSessionId'
    patch:
      tags: [Sessions]
      operationId: renameNativeSession
      summary: Rename an owned device session
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/SessionRename' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Sessions]
      operationId: revokeNativeSession
      summary: Sign out an owned device session
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/client-versions:
    get:
      tags: [Admin versions]
      operationId: listClientVersionPolicies
      summary: List version policies for every platform
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /admin/client-versions/{platformAppVersion}:
    parameters:
      - $ref: '#/components/parameters/PlatformVersion'
    put:
      tags: [Admin versions]
      operationId: updateClientVersionPolicy
      summary: Replace one platform version policy
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/PlatformVersionUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }

  /home:
    get:
      tags: [Home]
      operationId: getHome
      summary: Get the device-aware home feed
      description: Returns recommended, trending, latest, Shorts, and live rows. Authenticated users can also receive continue-watching and subscription rows. Providing rotation opts the recommended row into the website's hero ranking; exclude_ids deprioritizes recently shown videos without emptying small catalogues. Omit rotation to retain the original recommendations.
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { name: row_limit, in: query, schema: { type: integer, minimum: 4, maximum: 12 } }
        - name: rotation
          in: query
          description: Client-generated batch identifier, stable for the rotation interval (20 minutes by default).
          schema: { type: string, maxLength: 80, pattern: '^[A-Za-z0-9._:-]+$' }
        - name: exclude_ids
          in: query
          description: Comma-separated recently displayed video IDs; the ranking considers at most 24.
          schema: { type: string, maxLength: 500, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$' }
      responses:
        '200': { $ref: '#/components/responses/Home' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /home/sections/{section}:
    parameters:
      - $ref: '#/components/parameters/HomeSection'
    get:
      tags: [Home]
      operationId: getHomeSection
      summary: Page through one home section
      description: The `continue-watching` and `subscriptions` sections require authentication.
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/List' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /catalog/categories:
    get:
      tags: [Catalogue]
      operationId: listVideoCategories
      summary: List video categories and public video counts
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200': { $ref: '#/components/responses/Categories' }
        default: { $ref: '#/components/responses/Error' }

  /catalog/languages:
    get:
      tags: [Catalogue]
      operationId: listVideoLanguages
      summary: List video languages and public video counts
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Error' }

  /videos:
    get:
      tags:
        - Videos
      operationId: listVideos
      summary: Discover public videos
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 160
        - name: channel
          in: query
          description: Channel slug.
          schema:
            type: string
            maxLength: 140
        - name: category
          in: query
          description: Video category slug.
          schema:
            type: string
            maxLength: 140
        - name: type
          in: query
          schema:
            type: string
            enum:
              - video
              - videos
              - short
              - shorts
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - latest
              - trending
              - recommended
              - hero
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: upload_date
          in: query
          schema:
            type: string
            enum:
              - today
              - week
              - month
        - name: tag
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/VideoList"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"
  /videos/{video}:
    parameters:
      - $ref: '#/components/parameters/VideoSlug'
    get:
      tags: [Videos]
      operationId: getVideo
      summary: Get a viewable video
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200': { $ref: '#/components/responses/Video' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /videos/{video}/playback:
    parameters:
      - $ref: '#/components/parameters/VideoSlug'
    get:
      tags: [Videos]
      operationId: getVideoPlayback
      summary: Issue a playback session
      description: Selects only sources compatible with `X-PlayHub-Capabilities`, signs protected media URLs, and returns captions, chapters, ad decisions, resume state, and progress policy. Limited to 120/minute.
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - $ref: '#/components/parameters/Capabilities'
      responses:
        '200': { $ref: '#/components/responses/Playback' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /videos/{video}/receiver-playback:
    parameters:
      - $ref: '#/components/parameters/VideoSlug'
    post:
      tags: [Videos]
      operationId: createVideoReceiverPlayback
      summary: Issue a receiver-safe Cast manifest for a video
      description: Reauthorizes access at handoff time and returns bearer-free media URLs only when every required source origin is an explicitly configured, public HTTPS receiver origin. Native bearer tokens require `playback:read`. Protected URL lifetime covers the remaining duration plus a safety margin and is bounded by server policy. Direct external sources must be query- and fragment-free because this contract has no trusted external expiry metadata. Limited to 60/minute.
      security: [{ bearerAuth: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiverPlaybackRequest' }
      responses:
        '200': { $ref: '#/components/responses/ReceiverPlayback' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /videos/{video}/related:
    parameters:
      - $ref: '#/components/parameters/VideoSlug'
    get:
      tags: [Videos]
      operationId: listRelatedVideos
      summary: List related viewable videos
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage30'
      responses:
        '200': { $ref: '#/components/responses/VideoList' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /videos/{video}/comments:
    parameters:
      - $ref: '#/components/parameters/VideoSlug'
    get:
      tags: [Comments]
      operationId: listVideoComments
      summary: List top-level video comments
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { $ref: '#/components/responses/CommentList' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Comments]
      operationId: createVideoComment
      summary: Create a comment or reply
      description: Limited to 30/minute per user or source IP.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/CommentCreate' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }

  /videos/{video}/comments/{comment}/context:
    parameters:
      - $ref: '#/components/parameters/VideoSlug'
      - $ref: '#/components/parameters/CommentId'
    get:
      tags: [Comments]
      operationId: getVideoCommentContext
      summary: Resolve a visible video comment's ancestor IDs for opening its thread
      description: Ancestor IDs are ordered from the top-level comment to the immediate parent. An unavailable video, comment, or ancestor returns 404.
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200': { $ref: '#/components/responses/CommentContext' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /videos/{video}/progress:
    parameters:
      - $ref: '#/components/parameters/VideoSlug'
    put:
      tags: [History]
      operationId: updateVideoProgress
      summary: Upsert watch progress idempotently
      description: "`event_id` deduplicates client retries. Limited to 30/minute per user."
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/WatchProgress' }
      responses:
        '200': { $ref: '#/components/responses/Progress' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /videos/{video}/likes:
    parameters:
      - $ref: '#/components/parameters/VideoSlug'
    put:
      tags: [Videos]
      operationId: likeVideo
      summary: Set the viewer's video like
      description: Idempotent; repeated requests preserve one like.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Engagement' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Videos]
      operationId: unlikeVideo
      summary: Clear the viewer's video like
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Engagement' }
        default: { $ref: '#/components/responses/Error' }

  /videos/{video}/reports:
    parameters:
      - $ref: '#/components/parameters/VideoSlug'
    post:
      tags: [Videos]
      operationId: reportVideo
      summary: Report a viewable video
      description: Idempotently records one report for the viewer. Owners cannot report their own video. Video and comment reports share a 10/hour limit per user or source IP.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /comments/{comment}/replies:
    parameters:
      - $ref: '#/components/parameters/CommentId'
    get:
      tags: [Comments]
      operationId: listCommentReplies
      summary: List replies to a comment
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { $ref: '#/components/responses/CommentList' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /comments/{comment}:
    parameters:
      - $ref: '#/components/parameters/CommentId'
    patch:
      tags: [Comments]
      operationId: updateComment
      summary: Edit an owned comment
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/CommentUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Comments]
      operationId: deleteComment
      summary: Delete an authorized comment
      security: [{ bearerAuth: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /comments/{comment}/likes:
    parameters:
      - $ref: '#/components/parameters/CommentId'
    put:
      tags: [Comments]
      operationId: likeComment
      summary: Set the viewer's comment like
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Engagement' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Comments]
      operationId: unlikeComment
      summary: Clear the viewer's comment like
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Engagement' }
        default: { $ref: '#/components/responses/Error' }

  /comments/{comment}/report:
    parameters:
      - $ref: '#/components/parameters/CommentId'
    post:
      tags: [Comments]
      operationId: reportComment
      summary: Report a comment
      description: Video and comment reports share a 10/hour limit per user or source IP.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Error' }

  /comments/{comment}/pin:
    parameters:
      - $ref: '#/components/parameters/CommentId'
    post:
      tags: [Comments]
      operationId: togglePinnedComment
      summary: Toggle a comment's pinned state as the video owner
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /community-posts:
    get:
      tags:
        - Community
      operationId: listCommunityPosts
      summary: List viewable creator community posts
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: filter
          in: query
          schema:
            type: string
            enum:
              - all
              - following
              - images
              - polls
              - updates
              - videos
              - events
            default: all
        - name: q
          in: query
          schema:
            type: string
            maxLength: 160
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - latest
              - relevant
      responses:
        "200":
          $ref: "#/components/responses/CommunityPostList"
        default:
          $ref: "#/components/responses/Error"
  /community-posts/{communityPost}:
    parameters:
      - $ref: "#/components/parameters/CommunityPostId"
    get:
      tags:
        - Community
      operationId: getCommunityPost
      summary: Get a viewable creator community post
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          $ref: "#/components/responses/CommunityPost"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Community
      operationId: updateCommunityPost
      summary: update Community Post
      security:
        - bearerAuth: []
      parameters:
        - name: communityPost
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostWrite"
      responses:
        "200":
          description: Successful parity operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPostMutationEnvelope"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Community
      operationId: deleteCommunityPost
      summary: delete Community Post
      security:
        - bearerAuth: []
      parameters:
        - name: communityPost
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful parity operation.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
                  meta:
                    $ref: "#/components/schemas/RequestMeta"
        default:
          $ref: "#/components/responses/Error"
  /community-posts/{communityPost}/comments:
    parameters:
      - $ref: '#/components/parameters/CommunityPostId'
    get:
      tags: [Community, Comments]
      operationId: listCommunityPostComments
      summary: List top-level comments on a viewable community post
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { $ref: '#/components/responses/CommentList' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Community, Comments]
      operationId: createCommunityPostComment
      summary: Comment on a viewable community post or reply to its comment
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/CommentCreate' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }

  /community-posts/{communityPost}/comments/{comment}/context:
    parameters:
      - $ref: '#/components/parameters/CommunityPostId'
      - $ref: '#/components/parameters/CommentId'
    get:
      tags: [Community, Comments]
      operationId: getCommunityPostCommentContext
      summary: Resolve a visible community comment's ancestor IDs for opening its thread
      description: Ancestor IDs are ordered from the top-level comment to the immediate parent. An unavailable post, comment, or ancestor returns 404.
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200': { $ref: '#/components/responses/CommentContext' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /community-posts/{communityPost}/likes:
    parameters:
      - $ref: '#/components/parameters/CommunityPostId'
    put:
      tags: [Community]
      operationId: likeCommunityPost
      summary: Set the viewer's community post like
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Engagement' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Community]
      operationId: unlikeCommunityPost
      summary: Clear the viewer's community post like
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Engagement' }
