name: ChatDev tooling contracts
on:
  pull_request:
    paths: ['tools/chatdev/**', 'harness/chatdev/**', 'tools/test/chatdev*.test.mjs', 'tools/harness/chatdev-maintenance.mjs', 'tools/harness/cli.mjs', 'AGENTS.md', '.cursor/rules/chatdev.mdc', 'docs/chatdev-integration.md', '.github/workflows/chatdev.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node tools/harness/setup.mjs
      - run: node --test tools/test/harness.test.mjs tools/test/chatdev.test.mjs tools/test/chatdev-maintenance.test.mjs tools/test/chatdev-pr.test.mjs tools/test/chatdev-manager.test.mjs
