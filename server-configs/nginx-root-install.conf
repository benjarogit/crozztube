# Paste inside your existing server { } block.
# Keep your domain root unchanged:
# root /var/www/playhub;

index index.php index.html;
client_max_body_size 2048M;
client_body_timeout 300s;
client_header_timeout 300s;
send_timeout 300s;
fastcgi_read_timeout 300s;
fastcgi_send_timeout 300s;
fastcgi_connect_timeout 300s;

# Block Laravel internals because this package installs in domain root.
# Prefix locations also override generic PHP regex handlers loaded by hosting panels.
location ^~ /app/ { deny all; }
location ^~ /bootstrap/ { deny all; }
location ^~ /config/ { deny all; }
location ^~ /database/ { deny all; }
location ^~ /plugins/ { deny all; }
location ^~ /resources/ { deny all; }
location ^~ /routes/ { deny all; }
location ^~ /server-configs/ { deny all; }
location ^~ /storage/ { deny all; }
location ^~ /tests/ { deny all; }
location ^~ /tools/ { deny all; }
location ^~ /vendor/ { deny all; }
location ~ ^/(app|bootstrap|config|database|plugins|resources|routes|server-configs|storage|tests|tools|vendor)(/|$) { deny all; }
location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|vite\.config\.js|artisan|\.env|README\.md|phpunit\.xml)$ { deny all; }
location ~ /\. { deny all; }

# React build assets.
location ^~ /build/ {
    try_files $uri =404;
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000";
}

# Processed video files are served only through authorized/signed media routes.
location ^~ /uploads/videos/ { deny all; }
location ^~ /uploads/community/images/ { deny all; }
location ^~ /uploads/comments/ { deny all; }
location ^~ /uploads/messages/ { deny all; }
location ^~ /uploads/live-streams/thumbnails/ { deny all; }
location ^~ /uploads/live-streams/source/ { deny all; }

# Public uploaded files.
location ^~ /uploads/ {
    try_files $uri =404;
    expires 30d;
    access_log off;
    add_header Cache-Control "public";
}

# HLS/video-ready headers.
location ~* \.(m3u8)$ {
    try_files $uri =404;
    types { application/vnd.apple.mpegurl m3u8; }
    add_header Cache-Control "no-cache";
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type";
}

location ~* \.(ts|mp4|webm|mov|m4v)$ {
    try_files $uri =404;
    expires 365d;
    access_log off;
    add_header Cache-Control "public, max-age=31536000";
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type";
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_pass unix:/tmp/php-cgi-83.sock;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $document_root;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
}
