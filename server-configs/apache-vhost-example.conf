# Apache example. Keep DocumentRoot unchanged.
<VirtualHost *:80>
    ServerName playhub.example.com
    DocumentRoot /var/www/playhub

    <Directory /var/www/playhub>
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/playhub/uploads/videos>
        Require all denied
    </Directory>

    <Directory /var/www/playhub/uploads/community/images>
        Require all denied
    </Directory>

    <Directory /var/www/playhub/uploads/comments>
        Require all denied
    </Directory>

    <Directory /var/www/playhub/uploads/messages>
        Require all denied
    </Directory>

    <Directory /var/www/playhub/uploads/live-streams/thumbnails>
        Require all denied
    </Directory>

    <Directory /var/www/playhub/uploads/live-streams/source>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/playhub-error.log
    CustomLog ${APACHE_LOG_DIR}/playhub-access.log combined
</VirtualHost>
